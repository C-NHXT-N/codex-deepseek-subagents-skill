# Project-level Codex config for testing GPT main agent + DeepSeek worker.
# Keep the main/default provider in the user config; this project file only adds
# the DeepSeek worker provider behind a local Responses-compatible proxy.

[agents]
max_threads = 6
max_depth = 1

[model_providers.deepseek_responses]
name = "DeepSeek via Local Responses Proxy"
base_url = "http://127.0.0.1:4000/v1"
wire_api = "responses"
env_key = "DEEPSEEK_PROXY_API_KEY"

